minimumLimaVersion: "2.0.0"

images:
  - location: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
    arch: "x86_64"
  - location: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-arm64.qcow2"
    arch: "aarch64"

plain: true

cpus: 2
memory: "4GiB"
disk: "6GiB"

hostResolver:
  enabled: false
dns:
- 1.1.1.1
- 9.9.9.9

portForwards:
- guestPort: 8080
  static: true
- guestPort: 25565
  static: true

provision:
- mode: system
  script: |
    #!/bin/bash
    apt update

    /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
    echo 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"' >> ~/.bashrc

    brew install dufs
    apt install -y openjdk-25-jdk-headless

user:
  name: admin