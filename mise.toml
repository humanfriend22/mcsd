[env]
GOOS = "linux"
GOARCH = "arm64"
LIMA_INSTANCE = "debian-trixie"

# web/

[tasks."web:dev"]
description = "Run the Nuxt dev server"
dir = "web"
env = { NUXT_PUBLIC_API_HOST = "{{env.REMOTE_IP}}" }
run = "bun run dev"

[tasks."build:web"]
description = "Generates the Nuxt static site"
dir = "web"
sources = [
  "app/**/*.vue",
  "app/**/*.ts",
  "app/**/*.js",
  "nuxt.config.ts",
  "package.json"
]
outputs = [".output/public/**/*"]
run = "bun run generate"

[tasks."clean:web"]
run = "rm -rf web/dist web/.output web/.nuxt"

[tasks."embed"]
description = "Copy the built web assets into the Go embed"
run = "rm -rf src/web/dist && cp -r web/.output/public src/web/dist"

# src/

[tasks."build:go"]
description = "Compiles the Go binary (optimized for size)"
run = 'go build -C src -ldflags="-s -w" -o ../mcsd .'

[tasks."clean:go"]
run = "rm -f mcsd"

[tasks.build]
description = "Full build: fresh web + embed + Go binary"
run = [{ task = "build:web" }, { task = "embed" }, { task = "build:go" }]

[tasks."build:hot"]
description = "Go binary only, re-embedding whatever web build already exists"
run = [{ task = "embed" }, { task = "build:go" }]

# deploy

[tasks._deploy]
hide = true
env = { SSH_CONFIG = "$HOME/.lima/$LIMA_INSTANCE/ssh.config", HOST = "lima-$LIMA_INSTANCE" }
run = '''
scp -F "$SSH_CONFIG" mcsd "$HOST":/tmp/mcsd
ssh -F "$SSH_CONFIG" "$HOST" -- '
  sudo install -m 755 /tmp/mcsd /usr/local/bin/mcsd
  sudo systemctl restart mcsd.service
'
'''

[tasks.deploy]
description = "Build web + backend, deploy to the VM, and restart the service"
run = [{ task = "build" }, { task = "_deploy" }]

[tasks."deploy:hot"]
description = "Build backend only (stale frontend), deploy to the VM, and restart the service"
run = [{ task = "build:hot" }, { task = "_deploy" }]

# Lima VM

[tasks."vm:create"]
description = "Create the dev VM (once)"
run = "limactl create --yes ./debian-trixie.yaml"

[tasks."vm:up"]
description = "Start the dev VM"
run = 'limactl start "$LIMA_INSTANCE"'

[tasks."vm:down"]
description = "Stop the dev VM"
run = 'limactl stop "$LIMA_INSTANCE"'

[tasks."vm:shell"]
description = "Interactive shell in the dev VM"
raw = true
run = 'limactl shell "$LIMA_INSTANCE"'

[tasks."vm:delete"]
# depends = "vm:down"
description = "Delete the VM entirely; vm:up rebuilds it from scratch"
run = 'limactl delete --force "$LIMA_INSTANCE"'

[tools]
bun = "latest"
go = "latest"
lima = "latest"
